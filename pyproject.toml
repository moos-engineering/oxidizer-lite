[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oxidizer-lite"
dynamic = ["version"]
description = "Python workflow orchestration with stateless workers, persisted checkpoints, and Redis, Kafka, API, S3, and Iceberg adapters."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Moos Engineering" },
]
dependencies = [
    "PyYAML>=6.0",
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/moos-engineering/oxidizer-lite"
Repository = "https://github.com/moos-engineering/oxidizer-lite"
Issues = "https://github.com/moos-engineering/oxidizer-lite/issues"

[tool.hatch.version]
source = "vcs"

[project.optional-dependencies]
s3 = [
    "boto3>=1.34",
    "botocore>=1.34",
]
duckdb = [
    "boto3>=1.34",
    "duckdb==1.5.6",
    "jsonpath-ng>=1.7,<2",
    "pyarrow>=16",
    "pytz>=2024.1",
]
anvil = [
    "requests>=2.32",
]
redis = [
    "redis>=5.0",
]
kafka = [
    "confluent-kafka>=2.15,<3",
]
mcp = [
    "fastapi>=0.115,<1",
    "fastmcp>=4,<5",
    "uvicorn>=0.30",
    "lancedb>=0.25,<1",
    "fastembed>=0.7,<1",
]
test = [
    "fastapi>=0.115,<1",
    "lancedb>=0.25,<1",
    "fastembed>=0.7,<1",
    "boto3>=1.34",
    "botocore>=1.34",
    "build>=1.2",
    "confluent-kafka>=2.15,<3",
    "duckdb==1.5.6",
    "fastmcp>=4,<5",
    "uvicorn>=0.30",
    "jsonpath-ng>=1.7,<2",
    "pyarrow>=16",
    "pytest>=8.0",
    "redis>=5.0",
    "testcontainers>=4.0",
]
all = [
    "fastapi>=0.115,<1",
    "lancedb>=0.25,<1",
    "fastembed>=0.7,<1",
    "boto3>=1.34",
    "build>=1.2",
    "botocore>=1.34",
    "confluent-kafka>=2.15,<3",
    "duckdb==1.5.6",
    "fastmcp>=4,<5",
    "uvicorn>=0.30",
    "jsonpath-ng>=1.7,<2",
    "pyarrow>=16",
    "pytz>=2024.1",
    "redis>=5.0",
    "requests>=2.32",
    "testcontainers>=4.0",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "oxidizer",
    "docs",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["oxidizer"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "oxidizer/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: fake-client contract tests for backend adapters",
    "external_services: integration test may use explicitly configured external services",
    "integration: tests that require containerized backend services",
]
