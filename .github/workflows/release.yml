name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-linux:
    name: Linux tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,duckdb,anvil]'
      - name: Run tests
        run: python -m pytest -m "not integration"

  test-macos:
    name: macOS tests (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,duckdb,anvil]'
      - name: Run tests
        run: python -m pytest -m "not integration"

  build:
    needs: [test-linux, test-macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Read version from Git tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/p/oxidizer-lite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-container:
    needs: [build, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, api]
        arch: [amd64, arm64]
        include:
          - target: runtime
            suffix: ""
          - target: api
            suffix: "-api"
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Allow PyPI propagation
        run: sleep 60
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact PyPI version
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/oxidizer-lite.release.dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            OXIDIZER_VERSION=${{ needs.build.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}${{ matrix.suffix }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

  publish-container-manifest:
    needs: [build, publish-container]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      matrix:
        suffix: ["", "-api"]
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}${SUFFIX}" \
            --tag "${IMAGE}:latest${SUFFIX}" \
            "${IMAGE}:${VERSION}${SUFFIX}-amd64" \
            "${IMAGE}:${VERSION}${SUFFIX}-arm64"
