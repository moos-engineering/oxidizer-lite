templateVersion: 1
name: quickstart_observation_upsert
type: schema
schema:
  version: 1
  description: One current source revision per entity and observation time.
  columns:
    - {name: entity_id, type: string, nullable: false}
    - {name: observed_at, type: timestamp, nullable: false}
    - {name: source_revision, type: timestamp, nullable: false}
    - {name: metric_value, type: double, nullable: false}
    - {name: status, type: string, nullable: false}
    - {name: reading, type: int64, nullable: false}
  keys: [entity_id, observed_at]
  write:
    operation: upsert
    conflict:
      order_by: source_revision
      direction: descending
    update:
      mode: all_columns